apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds-gateway-api
  namespace: flux-system
spec:
  dependsOn:
    - name: meta-gitops-repos
  interval: 1h
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./crds/gateway-api
  prune: true
  wait: false
