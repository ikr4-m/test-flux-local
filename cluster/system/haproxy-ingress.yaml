---
apiVersion: v1
kind: Namespace
metadata:
  name: haproxy-ingress-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-haproxy-ingress
  namespace: flux-system
spec:
  targetNamespace: haproxy-ingress-system
  interval: 1h
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./system/haproxy-ingress
  prune: true
  wait: true
  dependsOn:
    - name: crds-gateway-api
