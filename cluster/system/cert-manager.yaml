---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-cert-manager
  namespace: flux-system
spec:
  targetNamespace: cert-manager-system
  interval: 1h
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./system/cert-manager
  prune: true
  wait: true
