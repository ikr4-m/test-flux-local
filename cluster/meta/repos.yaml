---
apiVersion: v1
kind: Namespace
metadata:
  name: meta-gitops-repos
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meta-gitops-repos
  namespace: flux-system
spec:
  targetNamespace: meta-gitops-repos
  interval: 1h
  retryInterval: 1m
  timeout: 5s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./meta/repos
  prune: true
  wait: false
