apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds-gateway-api-install
  namespace: flux-system
spec:
  dependsOn:
    - name: meta-gitops-repos
  interval: 1h
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: meta-gitops-repos
  path: ./config/crd/standard
  prune: true
  wait: false
